[project]
name = "kvm-bridge"
version = "0.1.0"
description = "Holds a JetKVM's WebRTC connection and speaks plain HTTP: a screen, a keyboard, and a mouse, lent out a session at a time."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10",
  "aiortc>=1.9",
  "pillow>=10",
]

[project.scripts]
bridge = "bridge.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-aiohttp>=1.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
